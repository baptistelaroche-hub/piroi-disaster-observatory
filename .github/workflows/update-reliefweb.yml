name: Update ReliefWeb

on:
  schedule:
    - cron: "0 3 * * *"   # tous les jours à 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r etl/requirements.txt

      - name: Récupérer ReliefWeb
        env:
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
        run: python etl/fetch_reliefweb.py

      - name: Committer les données mises à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/reliefweb_raw.json
          git diff --cached --quiet && echo "Aucun changement" && exit 0
          git commit -m "chore(data): mise à jour automatique ReliefWeb"
          git push
