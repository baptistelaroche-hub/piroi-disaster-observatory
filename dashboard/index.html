<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PIROI Disaster Observatory</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <header class="app-header">
    <h1>PIROI Disaster Observatory</h1>
    <p class="app-subtitle">Connaissance des risques et suivi des catastrophes — zone Océan Indien</p>
  </header>

  <section class="stat-tiles" id="stat-tiles" aria-label="Indicateurs globaux">
    <div class="stat-tile">
      <span class="stat-value" id="stat-total-disasters">—</span>
      <span class="stat-label">Catastrophes ReliefWeb</span>
    </div>
    <div class="stat-tile">
      <span class="stat-value" id="stat-total-cyclones">—</span>
      <span class="stat-label">Cyclones IBTrACS</span>
    </div>
    <div class="stat-tile">
      <span class="stat-value" id="stat-total-piroi">—</span>
      <span class="stat-label">Événements zone PIROI</span>
    </div>
    <div class="stat-tile">
      <span class="stat-value" id="stat-period">—</span>
      <span class="stat-label">Période couverte</span>
    </div>
  </section>

  <section class="filter-bar" id="filter-bar" aria-label="Filtres">
    <div class="filter-group">
      <span class="filter-label">Période</span>
      <input type="number" id="filter-year-min" class="filter-year-input" />
      <span>–</span>
      <input type="number" id="filter-year-max" class="filter-year-input" />
    </div>

    <div class="filter-group" id="filter-territories" aria-label="Territoires">
      <span class="filter-label">Territoires</span>
      <!-- généré en JS, groupé par région PIROI -->
    </div>

    <label class="filter-checkbox">
      <input type="checkbox" id="filter-piroi-response" />
      Réponse PIROI uniquement
    </label>

    <button type="button" id="filter-reset" class="filter-reset">Réinitialiser</button>
  </section>

  <main class="map-wrap">
    <div id="map" aria-label="Carte des catastrophes"></div>
    <aside class="legend" id="legend" aria-label="Légende des types d'aléas (cliquer pour filtrer)"></aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="js/hazard-colors.js"></script>
  <script src="js/data.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
