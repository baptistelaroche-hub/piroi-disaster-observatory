<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PIROI Disaster Observatory — Liste des catastrophes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css?v=11" />
</head>
<body>
  <header class="app-header">
    <div class="app-header-top">
      <div class="app-header-brand">
        <img src="assets/piroi-logo.jpg" alt="PIROI Center — Croix-Rouge française" class="app-logo" />
        <div>
          <h1>PIROI Disaster Observatory</h1>
          <p class="app-subtitle">Liste des catastrophes — zone Océan Indien</p>
        </div>
      </div>
      <nav class="app-nav" aria-label="Navigation">
        <a href="index.html" class="app-nav-link">Carte</a>
        <a href="liste.html" class="app-nav-link app-nav-link--active">Liste des catastrophes</a>
        <a href="bilan.html" class="app-nav-link">Bilan &amp; projection</a>
      </nav>
    </div>
  </header>

  <section class="filter-bar" id="filter-bar" aria-label="Filtres">
    <div class="filter-group">
      <span class="filter-label">Période</span>
      <input type="number" id="filter-year-min" class="filter-year-input" />
      <span>–</span>
      <input type="number" id="filter-year-max" class="filter-year-input" />
    </div>

    <div class="filter-group" id="filter-territories" aria-label="Territoires">
      <span class="filter-label">Territoires</span>
      <!-- généré en JS -->
    </div>

    <div class="filter-group" id="filter-categories" aria-label="Types d'aléa">
      <span class="filter-label">Types d'aléa</span>
      <!-- généré en JS -->
    </div>

    <label class="filter-checkbox">
      <input type="checkbox" id="filter-piroi-response" />
      Réponse PIROI uniquement
    </label>

    <button type="button" id="filter-reset" class="filter-reset">Réinitialiser</button>
  </section>

  <main class="list-wrap">
    <p class="list-count" id="list-count"></p>
    <div class="table-scroll">
      <table class="disasters-table" id="disasters-table">
        <thead>
          <tr>
            <th data-sort="name">Nom</th>
            <th data-sort="hazard_category">Type d'aléa</th>
            <th data-sort="territories">Territoires touchés</th>
            <th data-sort="date_start">Date</th>
            <th data-sort="status">Statut</th>
            <th class="table-center">Réponse PIROI</th>
            <th>Type d'activité</th>
            <th>Déploiement de stocks</th>
            <th data-sort="budget_total">Budget</th>
            <th data-sort="beneficiaries">Bénéficiaires</th>
            <th>ReliefWeb</th>
          </tr>
        </thead>
        <tbody id="disasters-tbody"></tbody>
      </table>
    </div>
  </main>

  <script src="js/hazard-colors.js?v=11"></script>
  <script src="js/hazard-icons.js?v=11"></script>
  <script src="js/data.js?v=11"></script>
  <script src="js/list.js?v=11"></script>
</body>
</html>
